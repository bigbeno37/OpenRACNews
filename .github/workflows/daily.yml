name: Daily news

on:
  # Shortly after each UTC day ends. GitHub can run this late, or skip a run when it's busy, so each run
  # covers the last few finished days (lookbackDays in config/tracking.json) rather than only yesterday.
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Finished days to collect (leave empty for lookbackDays)
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

# Only one run at a time, so two runs can't race to push data or to deploy.
concurrency:
  group: daily-news
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  collect:
    # A push only needs the site rebuilt: the data it would collect is what the schedule collects.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_AGENT_CREDENTIALS: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      # The token isn't kept in the checkout, so nothing later can use it by accident. Only the final
      # step, which pushes, is given it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Collect snapshots
        run: pnpm --silent snapshot ${DAYS:+--days "$DAYS"}
        env:
          DAYS: ${{ inputs.days }}
          GH_TOKEN: ${{ github.token }}

      # A failure here must not cost the day: the snapshot is still saved, the site still deploys with
      # the numbers on show, and the next run writes whichever reports are still missing.
      - name: Write reports
        if: env.HAS_AGENT_CREDENTIALS == 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: pnpm --silent reports:write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL || 'claude-opus-5-5' }}
          REPORT_BUDGET_USD: ${{ vars.REPORT_BUDGET_USD || '5' }}

      # This runs whatever the agent did, and removes any report that fails the checks.
      - name: Check reports
        run: pnpm --silent reports:check --prune

      - name: Save to the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only data/ is ever committed, whatever else may have changed in the checkout.
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(data): snapshot and reports for $(date -u +%F)"
          # Rebasing first, in case someone pushed to the branch while this job ran.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" "$GITHUB_REF_NAME"
          git push "$remote" "HEAD:${GITHUB_REF_NAME}"

  build:
    needs: collect
    # Runs after a successful collect, or on a push, where collect is skipped.
    if: ${{ !cancelled() && (needs.collect.result == 'success' || needs.collect.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      # By branch name rather than the triggering commit, to include what collect just pushed. A push made
      # with this workflow's own token doesn't trigger another run, which is why deploying lives here too.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
